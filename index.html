<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zalando+Sans+Expanded:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
        font-family: "Zalando Sans Expanded", sans-serif;
        display: flex;
        justify-content: center;
        flex-direction: column;
        align-items: center;
        background-color: coral;
        height: 100vh;
        }
        .container{
             background-color: #ffffff2f;
            box-shadow: 0 0 20px rgba(90, 79, 79, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(10px);
            width: 350px;
            height: 450px;
            padding: 20px;
            border-radius: 30px;
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        input{
            padding:0px 20px;
            width: 300px;
            height: 80px;
            border-radius: 20px;
            background-color: white;
            box-shadow: 0 0 20px rgba(90, 79, 79, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            text-align: right;
            color: #000000;
            font-size: 30px;
            box-sizing: border-box;
        }
        .btn-cont{
            display: grid;
            grid-template-columns: repeat(4,1fr);
                        gap: 10px;
        }
        .btn{
            width: 70px;
            height: 50px;
            border-radius: 10px;
            border: none;
            font-size: 25px;
            background: #000;
            color: white;
            cursor: pointer;
        }
        .mi{
            color: orange;
            font-weight: bold;
        }

    </style>
</head>
<body>
    <div class="container">
        <input type="text" class="display" >
        <div class="btn-cont">
            <button  class="btn mi">AC</button>
            <button class="btn">/</button>
            <button class="btn">%</button>
            <button class="btn mi">DEL</button>

            <button class="btn">7</button>
            <button class="btn">8</button>
            <button class="btn">9</button>
            <button class="btn">-</button>

            <button class="btn">4</button>
            <button class="btn">5</button>
            <button class="btn">6</button>
            <button class="btn">+</button>
            
            <button class="btn">1</button>
            <button class="btn">2</button>
            <button class="btn">3</button>
            <button class="btn">*</button>
            
            <button class="btn">0</button>
            <button class="btn">00</button>
            <button class="btn">.</button>
            <button class="btn mi">=</button>
        </div>
    </div>
    <script>
        let string="";
        let inp=document.querySelector('input');
        let btn=document.querySelectorAll('.btn');
        Array.from(btn).forEach((value)=>{
            value.addEventListener('click',(e)=>{
                if (e.target.innerHTML=='=') {
                    try{
                    string=eval(string);
                    }catch{
                        string="ERROR";
                    }

                }
                else if (e.target.innerHTML=='AC') {
                    string="";
                }
                else if (e.target.innerHTML=='DEL') {
                    string=string.slice(0,-1);
                }
                else{
                    string+=e.target.innerHTML;
                }
                inp.value = string; // ← this updates the input correctly
            })
        });


    </script>
</body>
</html>
